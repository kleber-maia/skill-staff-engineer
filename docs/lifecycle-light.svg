<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1166" width="460" height="1166" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" shape-rendering="geometricPrecision">
<title id="title">The staff-engineer lifecycle</title>
<desc id="desc">Agree: begin, grill-me, brief. Build: first working pass, preview, operator feedback (change requests loop back). Finish: tests, simplify, docs, lifecycle gate and verify. Save: handoff, ship it approval (hold loops back to finishing), ship as one commit.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5521b"/>
  </marker>
  <pattern id="panel-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#c9bba6" stroke-width="0.7" opacity="0.24"/>
  </pattern>
</defs>

<rect width="460" height="1166" fill="#f6f0e5"/>
<rect x="14" y="14" width="432" height="1138" rx="2" fill="none" stroke="#665e52" stroke-width="1" stroke-opacity="0.72"/>
<g fill="none" stroke="#665e52" stroke-width="1" stroke-linecap="square" stroke-opacity="0.72">
  <path d="M14 32H5 M22 14V5 M446 32H455 M438 14V5 M14 1134H5 M22 1152V1161 M446 1134H455 M438 1152V1161"/>
  <path d="M20 280H29 M431 280H440 M20 552H29 M431 552H440 M20 902H29 M431 902H440"/>
</g>

<rect x="18" y="18" width="424" height="250" rx="16" fill="#fbf7ef" stroke="#b3a48f" stroke-width="1.2"/>
