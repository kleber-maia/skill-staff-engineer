  <circle cx="340" cy="496" r="3.2"/>
  <circle cx="340" cy="1040" r="3.2"/>
</g>
<text x="401" y="418" font-size="12" font-style="italic" font-weight="600" fill="#c4491b" text-anchor="middle" transform="rotate(-90 401 418)">change this</text>
<text x="439" y="826" font-size="12" font-style="italic" font-weight="600" fill="#c4491b" text-anchor="middle" transform="rotate(-90 439 826)">hold</text>

<g fill="#fffaf2" stroke="#655d51" stroke-width="1.3">
  <rect x="40" y="42" width="300" height="52" rx="12"/>
  <rect x="40" y="120" width="300" height="52" rx="12"/>
  <rect x="40" y="198" width="300" height="52" rx="12"/>
  <rect x="40" y="314" width="300" height="52" rx="12"/>
  <rect x="40" y="392" width="300" height="52" rx="12"/>
  <rect x="40" y="586" width="300" height="52" rx="12"/>
  <rect x="40" y="664" width="300" height="52" rx="12"/>
  <rect x="40" y="742" width="300" height="52" rx="12"/>
  <rect x="40" y="820" width="300" height="52" rx="12"/>
  <rect x="40" y="936" width="300" height="52" rx="12"/>
</g>
<g fill="#fff0e6" stroke="#e5521b" stroke-width="1.5">
  <rect x="40" y="470" width="300" height="52" rx="26"/>
  <rect x="40" y="1014" width="300" height="52" rx="26"/>
  <rect x="40" y="1092" width="300" height="52" rx="12"/>
</g>

<g fill="#1a2024" text-anchor="middle">
  <text x="190" y="64" font-size="16" font-weight="600">begin</text>
  <text x="190" y="142" font-size="16" font-weight="600">grill-me</text>
  <text x="190" y="220" font-size="16" font-weight="600">brief</text>
  <text x="190" y="336" font-size="16" font-weight="600">first working pass</text>
  <text x="190" y="414" font-size="16" font-weight="600">preview</text>
  <text x="190" y="502" font-size="16" font-weight="600">operator feedback</text>
  <text x="190" y="618" font-size="16" font-weight="600">tests</text>
  <text x="190" y="686" font-size="16" font-weight="600">simplify</text>
  <text x="190" y="774" font-size="16" font-weight="600">docs</text>
  <text x="190" y="842" font-size="16" font-weight="600">lifecycle gate + verify</text>
  <text x="190" y="958" font-size="16" font-weight="600">handoff</text>
  <text x="190" y="1046" font-size="16" font-weight="600">“ship it”?</text>
  <text x="190" y="1114" font-size="16" font-weight="600">ship</text>
</g>
<g fill="#514b42" text-anchor="middle">
  <text x="190" y="83" font-size="12">one concern at a time</text>
  <text x="190" y="161" font-size="12">interview the operator, three questions a round</text>
  <text x="190" y="239" font-size="12">outcome, acceptance checks, non-goals</text>
  <text x="190" y="355" font-size="12">SOLID; no tests yet</text>
  <text x="190" y="433" font-size="12">show the working result</text>
  <text x="190" y="705" font-size="12">four-lens cleanup review</text>
  <text x="190" y="861" font-size="12">receipt for this exact code</text>
  <text x="190" y="977" font-size="12">plain-language approval request</text>
  <text x="190" y="1133" font-size="12">one guarded commit</text>
</g>

<g fill="none" stroke="#e5521b" stroke-width="1" stroke-linecap="square" opacity="0.78">
  <path d="M52 55H72 M52 133H72 M52 211H72 M52 327H72 M52 405H72 M52 599H72 M52 677H72 M52 755H72 M52 833H72 M52 949H72 M52 1027H72 M52 1105H72"/>
</g>
</svg>
