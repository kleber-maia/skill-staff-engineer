<text x="30" y="40" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1a2024">AGREE</text>
<line x1="30" y1="28" x2="92" y2="28" stroke="#e5521b" stroke-width="1.6"/>

<rect x="18" y="290" width="424" height="250" rx="16" fill="#fbf7ef" stroke="#b3a48f" stroke-width="1.2"/>
<rect x="18" y="290" width="424" height="250" rx="16" fill="url(#panel-grid)" opacity="0.5"/>
<text x="30" y="312" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1a2024">BUILD</text>
<line x1="30" y1="300" x2="92" y2="300" stroke="#e5521b" stroke-width="1.6"/>

<rect x="18" y="562" width="424" height="324" rx="16" fill="#fbf7ef" stroke="#b3a48f" stroke-width="1.2"/>
<rect x="18" y="562" width="424" height="324" rx="16" fill="url(#panel-grid)" opacity="0.5"/>
<text x="30" y="584" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1a2024">FINISH</text>
<line x1="30" y1="572" x2="92" y2="572" stroke="#e5521b" stroke-width="1.6"/>

<rect x="18" y="912" width="424" height="236" rx="16" fill="#fbf7ef" stroke="#b3a48f" stroke-width="1.2"/>
<rect x="18" y="912" width="424" height="236" rx="16" fill="url(#panel-grid)" opacity="0.5"/>
<text x="30" y="934" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1a2024">SAVE</text>
<line x1="30" y1="922" x2="92" y2="922" stroke="#e5521b" stroke-width="1.6"/>

<g fill="none" stroke="#e5521b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
  <line x1="190" y1="94" x2="190" y2="119"/>
  <line x1="190" y1="172" x2="190" y2="197"/>
  <line x1="190" y1="250" x2="190" y2="313"/>
  <line x1="190" y1="366" x2="190" y2="391"/>
  <line x1="190" y1="444" x2="190" y2="469"/>
  <line x1="190" y1="522" x2="190" y2="585"/>
  <line x1="190" y1="638" x2="190" y2="663"/>
  <line x1="190" y1="716" x2="190" y2="741"/>
  <line x1="190" y1="794" x2="190" y2="819"/>
  <line x1="190" y1="872" x2="190" y2="935"/>
  <line x1="190" y1="988" x2="190" y2="1013"/>
  <line x1="190" y1="1066" x2="190" y2="1091"/>
</g>
<text x="200" y="558" font-size="12" font-style="italic" font-weight="600" fill="#c4491b">looks good</text>
<text x="200" y="1083" font-size="12" font-style="italic" font-weight="600" fill="#c4491b">yes</text>

<g fill="none" stroke="#e5521b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)">
