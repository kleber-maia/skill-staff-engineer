<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1166" width="460" height="1166" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The staff-engineer lifecycle</title>
<desc id="desc">Agree: begin, grill-me, brief. Build: first working pass, preview, operator feedback (change requests loop back). Finish: tests, simplify, docs, lifecycle gate and verify. Save: handoff, ship it approval (hold loops back to finishing), ship as one commit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker></defs>
<rect x="8" y="8" width="444" height="256" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="24" y="30" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">AGREE</text>
<rect x="8" y="280" width="444" height="256" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="24" y="302" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">BUILD</text>
<rect x="8" y="552" width="444" height="334" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="24" y="574" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">FINISH</text>
<rect x="8" y="902" width="444" height="256" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="24" y="924" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">SAVE</text>
<line x1="190" y1="94" x2="190" y2="119" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="172" x2="190" y2="197" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="250" x2="190" y2="313" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="366" x2="190" y2="391" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="444" x2="190" y2="469" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="522" x2="190" y2="585" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="200" y="558" font-size="12" font-style="italic" fill="#8b949e">looks good</text>
<line x1="190" y1="638" x2="190" y2="663" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="716" x2="190" y2="741" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="794" x2="190" y2="819" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="872" x2="190" y2="935" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="988" x2="190" y2="1013" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="190" y1="1066" x2="190" y2="1091" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="200" y="1083" font-size="12" font-style="italic" fill="#8b949e">yes</text>
<path d="M 340 496 H 388 V 340 H 342" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="401" y="418" font-size="12" font-style="italic" fill="#8b949e" text-anchor="middle" transform="rotate(-90 401 418)">change this</text>
<path d="M 340 1040 H 426 V 612 H 342" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="439" y="826" font-size="12" font-style="italic" fill="#8b949e" text-anchor="middle" transform="rotate(-90 439 826)">hold</text>
<rect x="40" y="42" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="64" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">begin</text>
<text x="190" y="83" font-size="12" text-anchor="middle" fill="#8b949e">one concern at a time</text>
<rect x="40" y="120" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="142" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">grill-me</text>
<text x="190" y="161" font-size="12" text-anchor="middle" fill="#8b949e">interview the operator, three questions a round</text>
<rect x="40" y="198" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="220" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">brief</text>
<text x="190" y="239" font-size="12" text-anchor="middle" fill="#8b949e">outcome, acceptance checks, non-goals</text>
<rect x="40" y="314" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="336" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">first working pass</text>
<text x="190" y="355" font-size="12" text-anchor="middle" fill="#8b949e">SOLID; no tests yet</text>
<rect x="40" y="392" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="414" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">preview</text>
<text x="190" y="433" font-size="12" text-anchor="middle" fill="#8b949e">show the working result</text>
<rect x="40" y="470" width="300" height="52" rx="26" fill="#0c2d6b" stroke="#388bfd" stroke-width="1.4"/>
<text x="190" y="502" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">operator feedback</text>
<rect x="40" y="586" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="618" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">tests</text>
<rect x="40" y="664" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="686" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">simplify</text>
<text x="190" y="705" font-size="12" text-anchor="middle" fill="#8b949e">four-lens cleanup review</text>
<rect x="40" y="742" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="774" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">docs</text>
<rect x="40" y="820" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="842" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">lifecycle gate + verify</text>
<text x="190" y="861" font-size="12" text-anchor="middle" fill="#8b949e">receipt for this exact code</text>
<rect x="40" y="936" width="300" height="52" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="1.4"/>
<text x="190" y="958" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">handoff</text>
<text x="190" y="977" font-size="12" text-anchor="middle" fill="#8b949e">plain-language approval request</text>
<rect x="40" y="1014" width="300" height="52" rx="26" fill="#0c2d6b" stroke="#388bfd" stroke-width="1.4"/>
<text x="190" y="1046" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">“ship it”?</text>
<rect x="40" y="1092" width="300" height="52" rx="10" fill="#033a16" stroke="#2ea043" stroke-width="1.4"/>
<text x="190" y="1114" font-size="16" font-weight="600" text-anchor="middle" fill="#e6edf3">ship</text>
<text x="190" y="1133" font-size="12" text-anchor="middle" fill="#8b949e">one guarded commit</text>
</svg>
